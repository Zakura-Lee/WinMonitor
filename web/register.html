<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WinMonitor 注册</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="page-layout">
    <div class="card">
      <h1>WinMonitor 注册</h1>
      <form id="registerForm">
        <label for="user_type">用户类型</label>
        <select id="user_type" name="user_type">
          <option value="normal">普通用户</option>
          <option value="admin">管理员</option>
        </select>

        <label for="username">用户名</label>
        <input type="text" id="username" name="username" placeholder="设置用户名" required />

        <label for="password">密码</label>
        <input type="password" id="password" name="password" placeholder="设置密码" required />

        <label for="confirm_password">确认密码</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="再次输入密码" required />

        <button type="submit">注册</button>
        <small id="message"></small>
      </form>
      <div class="link-row">
        <span>已有账号？</span>
        <a href="/login">返回登录</a>
      </div>
    </div>
  </div>
  <script src="/js/auth.js"></script>
</body>
</html>
